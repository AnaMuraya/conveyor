services:
  postgres:
    image: postgres:16-alpine
    container_name: conveyor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conveyor
    ports:
      - '5432:5432'
    volumes:
      - conveyor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  conveyor_pgdata:
