services:
  postgres:
    image: postgres:16-alpine
    container_name: conveyor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conveyor
    ports:
      - '5432:5432'
    volumes:
      - conveyor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conveyor-redis
    # appendonly persistence so queued jobs survive a Redis restart, not just a
    # worker restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - conveyor_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  conveyor_pgdata:
  conveyor_redisdata:
